services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: seefixit-postgres
    restart: always
    environment:
      POSTGRES_USER: seefixit
      POSTGRES_PASSWORD: seefixit_secure_password
      POSTGRES_DB: seefixit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seefixit -d seefixit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seefixit-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://seefixit:seefixit_secure_password@postgres:5432/seefixit
      DATABASE_URL_MIGRATION: postgresql://seefixit:seefixit_secure_password@postgres:5432/seefixit
      JWT_SECRET: super_secure_production_jwt_secret_min_32_characters
      JWT_REFRESH_SECRET: super_secure_production_refresh_jwt_secret_min_32
      FRONTEND_ORIGIN: http://localhost
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seefixit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
